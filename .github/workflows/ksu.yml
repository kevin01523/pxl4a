name: Auto-Merge MSM Commit to KSU Branches

on:
  workflow_dispatch: # Manual trigger; you can switch to schedule or push as needed

jobs:
  merge-msm-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Workflow runs on the branch being targeted

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find ksu branches
        id: find_ksu_branches
        run: |
          git fetch --all
          ksu_branches=$(git branch -r | grep 'origin/.*ksu' | sed 's|origin/||' | tr '\n' ' ')
          echo "ksu_branches=$ksu_branches" >> $GITHUB_OUTPUT

      - name: Merge MSM commit into each ksu branch
        id: merge_commit
        run: |
          set -e
          MSM_REPO="https://github.com/kevin01523/kernel_google_msm-4.14.git"
          MSM_COMMIT="7c474f261e0a8f85b63f26a3bf132c1538d7f568"
          for branch in ${{ steps.find_ksu_branches.outputs.ksu_branches }}; do
            echo "Checking out $branch"
            git checkout $branch

            echo "Adding MSM repo as remote"
            git remote add msm $MSM_REPO || true
            git fetch msm $MSM_COMMIT

            echo "Attempting merge"
            git merge --no-ff --no-commit $MSM_COMMIT || { echo "Merge conflict in $branch, skipping"; git merge --abort; continue; }

            echo "Committing merge"
            git commit -am "Merge msm commit $MSM_COMMIT into $branch"

            echo "Pushing to origin/$branch"
            git push origin $branch
          done