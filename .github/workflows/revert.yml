name: Revert Specified Commits

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to revert commits on'
        required: true
        default: 'blu_spark_ksu_next_susfs-13'

jobs:
  revert_commits:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout target branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Set up Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Revert commits
      run: |
        git revert 1bdef623de9c3203a5072a10590f616ec0e98064 --no-edit
        git revert f3a23f4 --no-edit
        git revert 0f9aed02206f9979f983e6dfa3f9b044b38b813f --no-edit
        git revert f3a23f4388d81f3ac34e469a0a43ff0ec6872c11 --no-edit

    - name: Push changes
      run: |
        git push origin HEAD:${{ github.event.inputs.branch }}
